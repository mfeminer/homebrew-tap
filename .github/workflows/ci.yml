name: CI

# What can actually be wrong in this repository is a formula: a url pointing at
# nothing, a sha256 that no longer matches the asset, a binary that will not run
# once installed. None of that is visible by reading the file — only by installing
# it. So that is what this does, on every push.
#
# There is no bottle-building job here on purpose. Bottles cache a *compiled* build,
# and nothing here compiles anything; the scaffolding `brew tap-new` writes by
# default would exercise nothing real.
#
# One job per formula rather than a matrix over `Formula/*.rb`: the install is the
# same everywhere, but "and then run it" is different for each, and a job that only
# installed would miss the failures worth catching.
on:
  push:
  pull_request:
  # Releases are published from each project's own repository, not this one, so
  # nothing here changes when a URL rots or GitHub changes how assets are served. A
  # weekly run is what notices that before a user does.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    # arm64 and Sonoma — the platform lane's formula declares it supports, and the
    # runner lane's own CD builds the binary on.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Tap this checkout
        # The checkout is used directly as the tap, so everything below tests the
        # formula in this repository rather than whatever is already published.
        run: brew tap mfeminer/tap "file://$GITHUB_WORKSPACE"

      - name: Install lane
        run: brew install --formula --verbose mfeminer/tap/lane

      - name: Run it
        # The three things a user does first. A formula can install cleanly and still
        # leave a binary that will not start — a wrong asset, a quarantine flag, a
        # missing dependency — and only running it says otherwise.
        run: |
          lane --version
          lane --help
          # And it must still refuse cleanly when there is no terminal, rather than
          # hanging forever waiting for an answer nothing can give it.
          if lane < /dev/null; then
            echo "::error::expected a non-zero exit without a TTY" >&2
            exit 1
          fi

      - name: Check the installed version matches the formula
        # If the formula's version and the binary's own `--version` ever disagree,
        # `brew upgrade` and `brew list --versions` both start lying about what is
        # installed. This is the same check lane's own CD makes against the tag.
        run: |
          declared="$(brew info --json=v2 mfeminer/tap/lane | jq -r '.formulae[0].versions.stable')"
          built="$(lane --version | awk '{print $2}')"
          if [ "$built" != "$declared" ]; then
            echo "::error::formula declares $declared, binary reports $built" >&2
            exit 1
          fi
          echo "formula declares $declared, binary reports $built"

      - name: Audit the formula
        # Catches the class of mistake installing cannot: a `releases/latest` URL that
        # happens to resolve today, a missing license, a second copy of the version.
        run: brew audit --formula --strict --online mfeminer/tap/lane
